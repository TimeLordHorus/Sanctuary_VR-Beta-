<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sanctuary VR - Open Source Virtual Reality Environment">
  <title>Sanctuary VR - Beta</title>

  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <!-- HUD Styles -->
  <link rel="stylesheet" href="/src/styles/hud.css">
  <link rel="stylesheet" href="/src/styles/boot.css">
  <link rel="stylesheet" href="/src/styles/onboarding.css">
  <link rel="stylesheet" href="/src/styles/voice.css">
  <link rel="stylesheet" href="/src/styles/progression.css">
  <link rel="stylesheet" href="/src/styles/sanctuary-menu.css">
  <link rel="stylesheet" href="/src/styles/keyboard-hints.css">
  <link rel="stylesheet" href="/src/styles/welcome-login.css">
  <link rel="stylesheet" href="/src/styles/pantheon.css">
  <link rel="stylesheet" href="/src/styles/resources.css">
  <link rel="stylesheet" href="/src/styles/systems.css">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: white;
    }

    #loading-screen.hidden {
      display: none;
    }

    .loader {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .vr-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }

    .vr-button:hover {
      background: #45a049;
      transform: translateX(-50%) scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Boot Screen -->
  <div id="boot-screen">
    <!-- Boot content will be dynamically generated -->
  </div>

  <!-- Loading Screen (hidden initially, shown after boot) -->
  <div id="loading-screen" style="display: none;">
    <div class="loader"></div>
    <h2 style="margin-top: 20px;">Loading Sanctuary VR...</h2>
    <p>Preparing your virtual sanctuary</p>
  </div>

  <!-- HUD Container -->
  <div id="hud-container">
    <!-- Animated Background -->
    <div class="hud-background"></div>

    <!-- Particle Effects -->
    <div class="hud-particles" id="hud-particles"></div>

    <!-- Main Menu -->
    <div class="hud-menu">
      <div id="hud-menu-content">
        <!-- Menu content will be dynamically generated -->
      </div>
    </div>

    <!-- Dialog Overlay -->
    <div id="hud-dialog"></div>
  </div>

  <!-- UI Overlay -->
  <div id="ui-overlay" style="display: none;">
    <h3>Sanctuary VR</h3>
    <p id="vr-status">Checking VR support...</p>
    <p id="scene-info">Scene: Entrance Hall</p>
  </div>

  <!-- A-Frame VR Scene -->
  <a-scene
    loading-screen="enabled: false"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: true">

    <!-- Asset Management -->
    <a-assets>
      <!-- Textures -->
      <img id="sky-texture" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sky.jpg" crossorigin="anonymous">

      <!-- Audio -->
      <audio id="ambient-sound" src="assets/audio/sanctuary_ambience.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Environment -->
    <a-entity
      environment="preset: default;
                   groundColor: #8a7f8d;
                   groundColor2: #5a4f5d;
                   dressing: trees;
                   dressingAmount: 20;
                   dressingVariance: 2 1 2;
                   grid: cross"
      position="0 -0.1 0">
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="2 4 3"></a-entity>
    <a-entity light="type: point; color: #FFA; intensity: 0.4; distance: 10" position="0 3 -5"></a-entity>

    <!-- Sky -->
    <a-sky color="#87CEEB" material="shader: flat"></a-sky>

    <!-- Ground Plane -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="50"
      height="50"
      color="#7BC8A4"
      shadow="receive: true">
    </a-plane>

    <!-- Sanctuary Elements -->
    <!-- Central Altar -->
    <a-box
      position="0 0.5 -5"
      width="2"
      height="1"
      depth="1"
      color="#8B7355"
      shadow="cast: true">
    </a-box>

    <!-- Pillars -->
    <a-cylinder
      position="-3 2 -5"
      radius="0.3"
      height="4"
      color="#D3D3D3"
      shadow="cast: true">
    </a-cylinder>
    <a-cylinder
      position="3 2 -5"
      radius="0.3"
      height="4"
      color="#D3D3D3"
      shadow="cast: true">
    </a-cylinder>

    <!-- Meditation Cushions -->
    <a-cylinder
      position="2 0.2 -3"
      radius="0.5"
      height="0.4"
      color="#8B4513"
      class="interactable"
      event-set__enter="_event: mouseenter; color: #A0522D"
      event-set__leave="_event: mouseleave; color: #8B4513">
    </a-cylinder>
    <a-cylinder
      position="-2 0.2 -3"
      radius="0.5"
      height="0.4"
      color="#8B4513"
      class="interactable"
      event-set__enter="_event: mouseenter; color: #A0522D"
      event-set__leave="_event: mouseleave; color: #8B4513">
    </a-cylinder>

    <!-- Floating Orbs (decorative) -->
    <a-sphere
      position="0 2.5 -5"
      radius="0.3"
      color="#FFD700"
      material="emissive: #FFD700; emissiveIntensity: 0.5"
      animation="property: position; to: 0 3 -5; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
    </a-sphere>

    <!-- Info Panel -->
    <a-entity
      position="0 1.6 -2"
      geometry="primitive: plane; width: 1.5; height: 0.8"
      material="color: #333; opacity: 0.8"
      text="value: Welcome to Sanctuary VR\nExplore and find peace;
            align: center;
            color: white;
            wrapCount: 25">
    </a-entity>

    <!-- Camera Rig with Controllers -->
    <a-entity id="rig" position="0 0 0">
      <!-- Camera -->
      <a-entity
        id="camera"
        camera
        position="0 1.6 3"
        look-controls="pointerLockEnabled: true"
        wasd-controls="acceleration: 20">

        <!-- Cursor for interaction -->
        <a-cursor
          fuse="true"
          fuse-timeout="1500"
          color="#4CAF50"
          raycaster="objects: .interactable">
        </a-cursor>
      </a-entity>

      <!-- VR Controllers -->
      <a-entity
        id="leftHand"
        oculus-touch-controls="hand: left"
        vive-controls="hand: left"
        windows-motion-controls="hand: left">
      </a-entity>

      <a-entity
        id="rightHand"
        oculus-touch-controls="hand: right"
        vive-controls="hand: right"
        windows-motion-controls="hand: right"
        laser-controls
        raycaster="objects: .interactable">
      </a-entity>
    </a-entity>

    <!-- Ambient Sound -->
    <a-entity
      sound="src: #ambient-sound; autoplay: true; loop: true; volume: 0.3"
      position="0 2 -5">
    </a-entity>

    <!-- VR Spatial HUD (visible only in VR mode) -->
    <a-entity id="vr-spatial-menu" position="0 1.6 -2" visible="false">
      <a-plane
        width="3"
        height="2"
        color="#0f172a"
        opacity="0.9"
        shader="flat">
      </a-plane>

      <!-- Menu Title -->
      <a-text
        value="SANCTUARY VR"
        align="center"
        position="0 0.7 0.01"
        width="2.5"
        color="#6366f1">
      </a-text>

      <!-- Menu Options will be added dynamically -->
      <a-entity id="vr-menu-options" position="0 0 0.01"></a-entity>
    </a-entity>
  </a-scene>

  <!-- VR Entry Button -->
  <button id="enter-vr-button" class="vr-button" style="display: none;">Enter VR</button>

  <!-- Main Application Script -->
  <script type="module" src="/src/index.js"></script>

  <!-- Scene Interaction Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loadingScreen = document.getElementById('loading-screen');
      const vrStatus = document.getElementById('vr-status');
      const scene = document.querySelector('a-scene');

      // Hide loading screen when scene is loaded
      scene.addEventListener('loaded', () => {
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
        }, 1000);
      });

      // Check VR support
      if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            vrStatus.textContent = 'VR Ready ✓';
          } else {
            vrStatus.textContent = 'VR Not Available (Desktop Mode)';
          }
        });
      } else {
        vrStatus.textContent = 'VR Not Supported (Desktop Mode)';
      }

      // Add click handlers for interactables
      const interactables = document.querySelectorAll('.interactable');
      interactables.forEach(elem => {
        elem.addEventListener('click', () => {
          console.log('Interacted with:', elem);
        });
      });
    });
  </script>
</body>
</html>
